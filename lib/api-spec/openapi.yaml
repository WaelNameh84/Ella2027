openapi: 3.1.0
info:
  # Do not change the title; it controls generated import paths.
  title: Api
  version: 0.1.0
  description: AI Video Studio API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: studio
  - name: projects
  - name: providers
  - name: media
  - name: exports
  - name: jobs
  - name: admin
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /studio/summary:
    get:
      operationId: getStudioSummary
      tags: [studio]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioSummary"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List the current user's projects
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project and its scenes
      responses:
        "200":
          description: Project detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update project details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      responses:
        "204":
          description: Deleted
  /projects/{projectId}/scenes:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: createScene
      tags: [projects]
      summary: Add a scene
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SceneInput"
      responses:
        "201":
          description: Created scene
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scene"
  /projects/{projectId}/scenes/{sceneId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: sceneId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateScene
      tags: [projects]
      summary: Update a scene
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SceneUpdate"
      responses:
        "200":
          description: Updated scene
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scene"
    delete:
      operationId: deleteScene
      tags: [projects]
      summary: Delete a scene
      responses:
        "204":
          description: Deleted
  /projects/{projectId}/scenes/{sceneId}/jobs/image:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: sceneId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: queueSceneImageGeneration
      tags: [jobs]
      summary: Queue image generation for a scene
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SceneImageGenerationInput" }
      responses:
        "202":
          description: Image generation queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudioJob" }
  /projects/{projectId}/scenes/{sceneId}/jobs/video:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: sceneId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: queueSceneVideoGeneration
      tags: [jobs]
      summary: Queue text-to-video or image-to-video generation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SceneVideoGenerationInput" }
      responses:
        "202":
          description: Video generation queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudioJob" }
  /projects/{projectId}/scenes/{sceneId}/jobs/voice:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: sceneId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: queueSceneVoiceGeneration
      tags: [jobs]
      summary: Queue spoken narration generation for a scene
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SceneVoiceGenerationInput" }
      responses:
        "202":
          description: Voice generation queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudioJob" }
  /projects/{projectId}/generate-script:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: generateProjectScript
      tags: [projects]
      summary: Generate a script and storyboard using a configured provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScriptGenerationInput"
      responses:
        "200":
          description: Generated script and scenes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
  /projects/{projectId}/jobs/script:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: queueProjectScript
      tags: [jobs]
      summary: Queue script and storyboard generation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScriptGenerationInput"
      responses:
        "202":
          description: Script generation queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioJob"
  /projects/{projectId}/scenes/{sceneId}/transcriptions:
    post:
      operationId: transcribeSceneAudio
      tags: [projects]
      summary: Transcribe or translate uploaded audio into scene text
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: sceneId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Provider-Key-ID
          in: header
          required: false
          schema: { type: string, format: uuid }
        - name: X-Transcription-Mode
          in: header
          required: true
          schema: { type: string, enum: [transcribe, translate] }
        - name: X-Approve-Potential-Charges
          in: header
          required: true
          schema: { type: boolean }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              $ref: "#/components/schemas/AudioTranscriptionInput"
          audio/*:
            schema:
              $ref: "#/components/schemas/AudioTranscriptionInput"
      responses:
        "200":
          description: Transcription result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioTranscriptionResult"
        "400":
          description: Invalid upload or missing cost confirmation
        "409":
          description: No eligible transcription key
        "502":
          description: All configured transcription providers failed
  /projects/{projectId}/jobs/export:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: queueProjectExport
      tags: [jobs]
      summary: Queue project video export
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportInput"
      responses:
        "202":
          description: Video export queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioJob"
  /jobs:
    get:
      operationId: listStudioJobs
      tags: [jobs]
      summary: List the current user's processing jobs
      parameters:
        - name: projectId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Processing job history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudioJob"
  /jobs/{jobId}/retry:
    parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: retryStudioJob
      tags: [jobs]
      summary: Retry a failed processing job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudioJobRetryInput"
      responses:
        "202":
          description: Job queued again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioJob"
  /admin/access:
    get:
      operationId: getAdminAccess
      tags: [admin]
      summary: Check administrator access and apply the approved first-admin bootstrap
      responses:
        "200":
          description: Current user's administrator access
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAccess" }
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Get cross-user studio totals and recent activity
      responses:
        "200":
          description: Administrator overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOverview" }
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List user accounts and their studio activity
      responses:
        "200":
          description: User accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminUser" }
  /admin/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 255 }
    patch:
      operationId: updateAdminUser
      tags: [admin]
      summary: Change an account's role or sign-in status
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUserUpdate" }
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "409":
          description: Change would remove the last active administrator
  /admin/jobs:
    get:
      operationId: listAdminJobs
      tags: [admin]
      summary: List recent jobs and sanitized error details
      responses:
        "200":
          description: Recent jobs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminJob" }
  /admin/provider-keys:
    get:
      operationId: listAdminProviderKeys
      tags: [admin]
      summary: List provider health metadata without credentials
      responses:
        "200":
          description: Provider status metadata
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminProviderKey" }
  /provider-keys:
    get:
      operationId: listProviderKeys
      tags: [providers]
      summary: List provider key metadata without secret values
      responses:
        "200":
          description: Provider key metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderKey"
    post:
      operationId: createProviderKey
      tags: [providers]
      summary: Save a provider key securely
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderKeyInput"
      responses:
        "201":
          description: Saved metadata only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderKey"
  /provider-keys/{keyId}:
    parameters:
      - name: keyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateProviderKey
      tags: [providers]
      summary: Update provider key metadata or replace its secret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderKeyUpdate"
      responses:
        "200":
          description: Updated metadata only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderKey"
    delete:
      operationId: deleteProviderKey
      tags: [providers]
      summary: Delete a provider key
      responses:
        "204":
          description: Deleted
  /provider-keys/{keyId}/test:
    post:
      operationId: testProviderKey
      tags: [providers]
      summary: Test one provider key with a minimal request
      parameters:
        - name: keyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderTestResult"
  /provider-settings:
    get:
      operationId: getProviderSettings
      tags: [providers]
      summary: Get key rotation preferences
      responses:
        "200":
          description: Provider preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderSettings"
    put:
      operationId: updateProviderSettings
      tags: [providers]
      summary: Update key rotation preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderSettings"
      responses:
        "200":
          description: Saved preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderSettings"
  /media/search:
    get:
      operationId: searchFreeMedia
      tags: [media]
      summary: Search real openly licensed media
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: mediaType
          in: query
          schema:
            type: string
            enum: [image, video, audio]
            default: image
        - name: source
          in: query
          schema:
            type: string
            enum: [openverse, wikimedia, archive, pexels, pixabay, unsplash]
            default: openverse
        - name: orientation
          in: query
          schema:
            type: string
            enum: [landscape, portrait, square]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: Search results from Openverse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaSearchResponse"
  /media/favorites:
    get:
      operationId: listFavoriteMedia
      tags: [media]
      summary: List the current user's saved media
      responses:
        "200":
          description: Saved media
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MediaFavorite" }
    post:
      operationId: createFavoriteMedia
      tags: [media]
      summary: Save a media item to favorites
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaFavoriteInput" }
      responses:
        "201":
          description: Saved media item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaFavorite" }
  /media/favorites/{favoriteId}:
    delete:
      operationId: deleteFavoriteMedia
      tags: [media]
      summary: Remove a saved media item
      parameters:
        - name: favoriteId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Removed
  /free-tools:
    get:
      operationId: listFreeTools
      tags: [media]
      summary: List service setup and pricing notes
      responses:
        "200":
          description: Service reference list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FreeTool"
  /projects/{projectId}/export:
    post:
      operationId: exportProject
      tags: [exports]
      summary: Render a project timeline to a downloadable video
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportInput"
      responses:
        "200":
          description: Rendered video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportResult"
  /projects/{projectId}/export/file:
    get:
      operationId: downloadProjectExport
      tags: [exports]
      summary: Download the latest completed project video
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Video file
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "404":
          description: No completed export found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    AdminAccess:
      type: object
      properties:
        isAdmin: { type: boolean }
        role: { type: string, enum: [member, admin] }
      required: [isAdmin, role]
    AdminOverview:
      type: object
      properties:
        userCount: { type: integer }
        projectCount: { type: integer }
        sceneCount: { type: integer }
        jobCount: { type: integer }
        queuedJobs: { type: integer }
        failedJobs: { type: integer }
        enabledProviderKeys: { type: integer }
        rateLimitedKeys: { type: integer }
        quotaLimitedKeys: { type: integer }
      required: [userCount, projectCount, sceneCount, jobCount, queuedJobs, failedJobs, enabledProviderKeys, rateLimitedKeys, quotaLimitedKeys]
    AdminUser:
      type: object
      properties:
        id: { type: string }
        email: { type: ["string", "null"] }
        displayName: { type: ["string", "null"] }
        role: { type: string, enum: [member, admin] }
        banned: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastSignInAt: { type: ["string", "null"], format: date-time }
        projectCount: { type: integer }
        jobCount: { type: integer }
        providerKeyCount: { type: integer }
      required: [id, email, displayName, role, banned, createdAt, lastSignInAt, projectCount, jobCount, providerKeyCount]
    AdminUserUpdate:
      type: object
      properties:
        role: { type: string, enum: [member, admin] }
        banned: { type: boolean }
    AdminJob:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string }
        userEmail: { type: ["string", "null"] }
        projectId: { type: string, format: uuid }
        projectTitle: { type: string }
        jobType: { type: string, enum: [script, export, image, video, voice] }
        status: { type: string, enum: [queued, running, completed, failed] }
        stage: { type: string }
        progress: { type: integer, minimum: 0, maximum: 100 }
        message: { type: string }
        error: { type: ["string", "null"] }
        attempts: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, userId, userEmail, projectId, projectTitle, jobType, status, stage, progress, message, error, attempts, createdAt, updatedAt]
    AdminProviderKey:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string }
        userEmail: { type: ["string", "null"] }
        provider: { type: string }
        label: { type: string }
        serviceType: { type: string }
        enabled: { type: boolean }
        priority: { type: integer }
        status: { type: string, enum: [untested, valid, invalid, rate_limited, quota_limited, unavailable] }
        lastTestAt: { type: ["string", "null"], format: date-time }
        usedCount: { type: integer }
        cooldownUntil: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
      required: [id, userId, userEmail, provider, label, serviceType, enabled, priority, status, lastTestAt, usedCount, cooldownUntil, createdAt]
    StudioSummary:
      type: object
      properties:
        projectCount: { type: integer }
        activeCount: { type: integer }
        sceneCount: { type: integer }
        providerCount: { type: integer }
        recentProjects:
          type: array
          items: { $ref: "#/components/schemas/Project" }
      required: [projectCount, activeCount, sceneCount, providerCount, recentProjects]
    Project:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        idea: { type: string }
        videoType: { type: string }
        language: { type: string }
        durationSeconds: { type: integer }
        audience: { type: string }
        visualStyle: { type: string }
        aspectRatio: { type: string }
        characters:
          type: array
          items: { $ref: "#/components/schemas/CharacterProfile" }
        musicUrl: { type: ["string", "null"], format: uri-reference }
        musicVolume: { type: integer, minimum: 0, maximum: 100 }
        status: { type: string, enum: [draft, scripting, editing, exporting, completed, failed] }
        progress: { type: integer }
        sceneCount: { type: integer }
        exportUrl: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, title, idea, videoType, language, durationSeconds, audience, visualStyle, aspectRatio, characters, musicUrl, musicVolume, status, progress, sceneCount, exportUrl, createdAt, updatedAt]
    CharacterProfile:
      type: object
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, maxLength: 4000 }
        costume: { type: string, maxLength: 2000 }
        voiceDescription: { type: string, maxLength: 1000 }
        referenceImageUrl: { type: ["string", "null"], format: uri }
      required: [id, name, description, costume, voiceDescription, referenceImageUrl]
    ProjectDetail:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          properties:
            scenes:
              type: array
              items: { $ref: "#/components/schemas/Scene" }
          required: [scenes]
    ProjectInput:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        idea: { type: string, minLength: 1, maxLength: 12000 }
        videoType: { type: string }
        language: { type: string }
        durationSeconds: { type: integer, minimum: 5, maximum: 3600 }
        audience: { type: string }
        visualStyle: { type: string }
        aspectRatio: { type: string, enum: ["16:9", "9:16", "1:1", "4:5", "4:3", "3:2"] }
        characters:
          type: array
          maxItems: 24
          items: { $ref: "#/components/schemas/CharacterProfile" }
        musicUrl: { type: ["string", "null"], format: uri-reference }
        musicVolume: { type: integer, minimum: 0, maximum: 100 }
      required: [title, idea, videoType, language, durationSeconds, audience, visualStyle, aspectRatio]
    ProjectUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        idea: { type: string, maxLength: 12000 }
        videoType: { type: string }
        language: { type: string }
        durationSeconds: { type: integer, minimum: 5, maximum: 3600 }
        audience: { type: string }
        visualStyle: { type: string }
        aspectRatio: { type: string, enum: ["16:9", "9:16", "1:1", "4:5", "4:3", "3:2"] }
        characters:
          type: array
          maxItems: 24
          items: { $ref: "#/components/schemas/CharacterProfile" }
        musicUrl: { type: ["string", "null"], format: uri-reference }
        musicVolume: { type: integer, minimum: 0, maximum: 100 }
    Scene:
      type: object
      properties:
