name: ELLA Wan Engine Checks

on:
  push:
    branches:
      - feature/ella-wan22-engine
    paths:
      - "services/ella-wan-engine/**"
      - "notebooks/ELLA_WAN_ENGINE_KAGGLE.ipynb"
      - ".github/workflows/ella-wan-engine-tests.yml"
  pull_request:
    paths:
      - "services/ella-wan-engine/**"
      - "notebooks/ELLA_WAN_ENGINE_KAGGLE.ipynb"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest nbformat requests
      - run: pytest -q services/ella-wan-engine/test_runner.py services/kaggle-wan22-worker/test_wan22_worker.py
      - name: Validate Kaggle notebook
        run: python -c "import nbformat; nbformat.validate(nbformat.read('notebooks/ELLA_WAN_ENGINE_KAGGLE.ipynb', as_version=4)); print('Notebook JSON/schema valid')"
