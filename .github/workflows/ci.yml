name: Ella CI

on:
  pull_request:
  push:
    branches: [main, "feature/**"]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm --filter @workspace/api-server test
      - run: pnpm --filter @workspace/api-server build
      - name: Live free image provider smoke check
        run: node artifacts/api-server/test/provider-live-smoke.mjs
        continue-on-error: true
  gpu-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r services/ella-gpu-worker/requirements.txt
      - run: pytest -q services/ella-gpu-worker/test_worker.py
